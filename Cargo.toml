[package]
name = "zlgcan-driver"
version = "0.2.7"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "zlgcan_driver"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.28"
rs-can = { git = "https://github.com/jesses2025smith/rust-can.git", package = "rs-can", rev = "93215a5db0ff6116a0e977acc81a6a75fa0b86c6" }
zlgcan = { git = "https://github.com/jesses2025smith/rust-can.git", package = "zlgcan", rev = "93215a5db0ff6116a0e977acc81a6a75fa0b86c6", features = ["pyo3"] }

[dev-dependencies]
anyhow = "1.0"
